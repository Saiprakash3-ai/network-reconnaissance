[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "network-reconnaissance"
version = "0.1.0"
description = "Local-first Advanced Network Reconnaissance & Intelligence Laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Network Reconnaissance Contributors"}]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.32",
  "greenlet>=3.0.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.13.2",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "jinja2>=3.1.4",
  "defusedxml>=0.7.1",
  "fpdf2>=2.7.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.6.2",
]
scapy = ["scapy>=2.5.0"]

[project.scripts]
nr = "backend.cli:app"
network-reconnaissance = "backend.cli:app"

[tool.setuptools.packages.find]
include = ["backend*", "engines*", "integrations*", "database*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
