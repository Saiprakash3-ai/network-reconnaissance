name: nr-isolated-lab
description: Isolated local lab network for Network Reconnaissance
subnet: 192.168.56.0/24
gateway: 192.168.56.1
notes:
  - Use host-only/internal virtual network.
  - Do not bridge vulnerable targets to public networks.
  - Enable private-lab-only mode in config/settings.yaml.

nodes:
  - name: nr-controller
    role: controller
    ip: 192.168.56.5
    os: Ubuntu WSL2 / Windows 11 host
  - name: kali
    role: operator
    ip: 192.168.56.10
    os: Kali Linux
  - name: ubuntu-server
    role: target
    ip: 192.168.56.20
    os: Ubuntu Server
  - name: windows-eval
    role: target
    ip: 192.168.56.30
    os: Windows Evaluation
  - name: metasploitable
    role: target
    ip: 192.168.56.40
    os: Metasploitable 2
  - name: juice-shop
    role: target
    ip: 192.168.56.50
    os: OWASP Juice Shop
